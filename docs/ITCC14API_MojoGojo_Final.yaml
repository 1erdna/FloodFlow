                status_note: Rescue team dispatched.
                handled_by: 15
                created_at: '2026-11-03T09:45:00Z'
                updated_at: '2026-11-03T09:50:00Z'
                resolved_at: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
# ---------------------------------------------------------- COMPONENTS
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `/auth/login` or `/auth/register`, sent as `Authorization Bearer <token>`.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Numeric id of the resource.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: The request body or parameters are invalid (400).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 400
            error: Bad Request
            message: Validation failed.
            details:
              - field: severity
                issue: must be one of low, moderate, high, severe
    Unauthorized:
      description: Missing, invalid or expired token (401).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 401
            error: Unauthorized
            message: Authentication token is missing or invalid.
    Forbidden:
      description: The user's role or ownership does not allow this action (403).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 403
            error: Forbidden
            message: You do not have permission to perform this action.
    NotFound:
      description: The resource, or a resource referenced in the request, was not found (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 404
            error: Not Found
            message: Resource not found.
    Conflict:
      description: The request conflicts with the current state of the data, such as a duplicate value, invalid status transition or existing child records (409).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 409
            error: Conflict
            message: The request conflicts with the current state of the resource.
  schemas:
    Error:
      type: object
      required: [status, error, message]
      properties:
        status:
          type: integer
          description: HTTP status code.
        error:
          type: string
          description: Short HTTP status name.
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: array
          description: Field-level problems, present for validation errors.
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string
    Role:
      type: string
      enum: [commuter, admin]
    FloodSeverity:
      type: string
      description: |
        `low` ankle-deep or less; `moderate` about knee-deep; `high` waist-deep; `severe` above waist or fast-moving water.
      enum: [low, moderate, high, severe]
    FloodLevel:
      type: string
      description: |
        Street-level result. `no_recent_reports` means unknown (not safe). `clear` means recent reports say flooding has cleared.
        Other values are the highest severity among active reports.
      enum: [no_recent_reports, clear, low, moderate, high, severe]
    ReportStatus:
      type: string
      description: '`pending` new, `verified` or `rejected` by an admin, `resolved` flooding has cleared.'
      enum: [pending, verified, rejected, resolved]
    AdvisoryType:
      type: string
      enum: [rain, flood_warning, evacuation, general]
    AdvisoryLevel:
      type: string
      enum: [info, watch, warning, critical]
    AssistanceType:
      type: string
      enum: [rescue, evacuation, medical, supplies, other]
    AssistanceStatus:
      type: string
      enum: [open, acknowledged, in_progress, resolved, cancelled]
    # ---- Users
    User:
      type: object
      required: [id, name, email, role, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        coverage_area_id:
          type: integer
          nullable: true
          description: Home or assigned coverage area.
        created_at:
          type: string
          format: date-time
          readOnly: true
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
        coverage_area_id:
          type: integer
          minimum: 1
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token.
        user:
          $ref: '#/components/schemas/User'
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        coverage_area_id:
          type: integer
          minimum: 1
          nullable: true
    UserAdminUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        coverage_area_id:
          type: integer
          minimum: 1
          nullable: true
    # ---- Coverage areas
    District:
      type: string
      description: City council district. `first_district` is the western areas, `second_district` the eastern areas and downtown.
      enum: [first_district, second_district]
    CoverageArea:
      type: object
      required: [id, name, barangay, city, district, is_coastal_riverfront, is_active, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        barangay:
          type: string
          description: Barangay name from the flood-prone list, e.g. `Carmen` or `Barangay 17`.
        city:
          type: string
        district:
          $ref: '#/components/schemas/District'
        is_coastal_riverfront:
          type: boolean
          description: True for high-density coastal or riverfront zones exposed to overflowing waterways and high tides.
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    CoverageAreaInput:
      type: object
      required: [name, barangay, city, district]
      properties:
        district:
          $ref: '#/components/schemas/District'
        is_coastal_riverfront:
          type: boolean
          default: false
        name:
          type: string
          minLength: 2
          maxLength: 100
        barangay:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        is_active:
          type: boolean
          default: true
    # ---- Streets
    StreetFloodStatus:
      type: object
      description: |
        Computed from reports, never written by clients. Active reports are those with status `pending`, `verified` or `resolved`
        whose `expires_at` (6 hours after `observed_at`) has not passed. The `level` is the highest severity among active
        `pending`/`verified` reports. If none remain but at least one active `resolved` report exists, the level is `clear`.
        Otherwise it is `no_recent_reports`. Recalculated whenever a report is created, edited, verified, rejected, resolved or deleted, and as reports expire.
      required: [level, active_report_count, verified_report_count, last_updated, computed_at]
      properties:
        level:
          $ref: '#/components/schemas/FloodLevel'
        active_report_count:
          type: integer
          minimum: 0
        verified_report_count:
          type: integer
          minimum: 0
          description: How many of the active reports are admin-verified.
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: Latest `observed_at` or `resolved_at` among reports that contributed. Null when there are none.
        computed_at:
          type: string
          format: date-time
        note:
          type: string
          description: Plain-language caveat. Never states that the street is safe.
    Street:
      type: object
      required: [id, name, coverage_area_id, is_active, flood_status, created_at]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        coverage_area_id:
          type: integer
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        connected_street_ids:
          type: array
          description: Streets that connect to this one, used for bypass suggestions.
          items:
            type: integer
        is_active:
          type: boolean
        flood_status:
          $ref: '#/components/schemas/StreetFloodStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
    StreetCreate:
      type: object
      required: [name, coverage_area_id]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        coverage_area_id:
          type: integer
          minimum: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        connected_street_ids:
          type: array
          items:
            type: integer
            minimum: 1
        is_active:
          type: boolean
          default: true
    StreetUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        coverage_area_id:
          type: integer
          minimum: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        connected_street_ids:
          type: array
          items:
            type: integer
            minimum: 1
        is_active:
          type: boolean
    BypassSuggestion:
      type: object
      required: [street_id, name, level, active_report_count, last_updated]
      properties:
        street_id:
          type: integer
        name:
          type: string
        level:
          $ref: '#/components/schemas/FloodLevel'
        active_report_count:
          type: integer
          minimum: 0
        last_updated:
          type: string
          format: date-time
          nullable: true
          description: When the information behind this suggestion was last updated. Null if there are no recent reports.
        note:
          type: string
    BypassSuggestionList:
      type: object
      required: [street_id, computed_at, disclaimer, suggestions]
      properties:
        street_id:
          type: integer
        computed_at:
          type: string
          format: date-time
        disclaimer:
          type: string
          description: States that suggestions may be outdated and are not a safety guarantee.
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/BypassSuggestion'
    # ---- Flood reports
    FloodReport:
      type: object
      required: [id, street_id, severity, observed_at, expires_at, is_active, status, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        street_id:
          type: integer
          description: Street this report is about. Required and immutable.
        reporter_id:
          type: integer
          nullable: true
          description: Owner. Null if the user was deleted.
        severity:
          $ref: '#/components/schemas/FloodSeverity'
        description:
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: '`observed_at` plus 6 hours. After this the report no longer influences street status.'
        is_active:
          type: boolean
          readOnly: true
          description: True when not expired and not rejected.
        status:
          $ref: '#/components/schemas/ReportStatus'
        verified_by:
          type: integer
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        verification_reason:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    FloodReportCreate:
      type: object
      required: [street_id, severity]
      properties:
        street_id:
          type: integer
          minimum: 1
        severity:
          $ref: '#/components/schemas/FloodSeverity'
        description:
          type: string
          maxLength: 500
        observed_at:
          type: string
          format: date-time
          description: Defaults to the server time. Must not be in the future or older than 24 hours.
    FloodReportUpdate:
      type: object
      minProperties: 1
      properties:
        severity:
          $ref: '#/components/schemas/FloodSeverity'
        description:
          type: string
          maxLength: 500
        observed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [resolved]
          description: Only `resolved` is accepted here.
    ReportVerification:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [verified, rejected]
        reason:
          type: string
          maxLength: 300
          description: Required when `decision` is `rejected`.
    # ---- Advisories
    Advisory:
      type: object
      required: [id, title, message, advisory_type, level, starts_at, expires_at, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        message:
          type: string
        advisory_type:
          $ref: '#/components/schemas/AdvisoryType'
        level:
          $ref: '#/components/schemas/AdvisoryLevel'
        coverage_area_id:
          type: integer
          nullable: true
          description: Null means city-wide.
        created_by:
          type: integer
          nullable: true
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        is_active:
          type: boolean
          readOnly: true
          description: True when `starts_at` <= now < `expires_at`.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AdvisoryCreate:
      type: object
      required: [title, message, advisory_type, level, expires_at]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 3
          maxLength: 1000
        advisory_type:
          $ref: '#/components/schemas/AdvisoryType'
        level:
          $ref: '#/components/schemas/AdvisoryLevel'
        coverage_area_id:
          type: integer
          minimum: 1
          nullable: true
          description: Omit or null for a city-wide advisory.
        starts_at:
          type: string
          format: date-time
          description: Defaults to now.
        expires_at:
          type: string
          format: date-time
          description: Must be later than `starts_at`.
    AdvisoryUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        message:
          type: string
          minLength: 3
          maxLength: 1000
        advisory_type:
          $ref: '#/components/schemas/AdvisoryType'
        level:
          $ref: '#/components/schemas/AdvisoryLevel'
        coverage_area_id:
          type: integer
          minimum: 1
          nullable: true
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    # ---- Assistance requests
    AssistanceRequest:
      type: object
      required: [id, street_id, request_type, description, contact_number, number_of_people, status, created_at, updated_at]
      properties:
        id:
          type: integer
          readOnly: true
        requester_id:
          type: integer
          nullable: true
          description: Owner. Null if the user was deleted.
        street_id:
          type: integer
        coverage_area_id:
          type: integer
          readOnly: true
          description: Copied from the street.
        report_id:
          type: integer
          nullable: true
          description: Optional related flood report on the same street.
        request_type:
          $ref: '#/components/schemas/AssistanceType'
        description:
          type: string
        contact_number:
          type: string
        number_of_people:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/AssistanceStatus'
        status_note:
          type: string
          nullable: true
        handled_by:
          type: integer
          nullable: true
          description: Admin who last changed the status.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
    AssistanceRequestCreate:
      type: object
      required: [street_id, request_type, description, contact_number, number_of_people]
      properties:
        street_id:
          type: integer
          minimum: 1
        report_id:
          type: integer
          minimum: 1
          nullable: true
        request_type:
          $ref: '#/components/schemas/AssistanceType'
        description:
          type: string
          minLength: 5
          maxLength: 500
        contact_number:
          type: string
          pattern: '^[0-9+() -]{7,20}$'
        number_of_people:
          type: integer
          minimum: 1
          maximum: 100
    AssistanceRequestUpdate:
      type: object
      minProperties: 1
      properties:
        request_type:
          $ref: '#/components/schemas/AssistanceType'
        description:
          type: string
          minLength: 5
          maxLength: 500
        contact_number:
          type: string
          pattern: '^[0-9+() -]{7,20}$'
        number_of_people:
          type: integer
          minimum: 1
          maximum: 100
    AssistanceStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [acknowledged, in_progress, resolved, cancelled]
        status_note:
          type: string
          maxLength: 300