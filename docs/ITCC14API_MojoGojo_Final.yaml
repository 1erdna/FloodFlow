            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequest'
              example:
                id: 21
                requester_id: 12
                street_id: 7
                coverage_area_id: 1
                report_id: 101
                request_type: evacuation
                description: Three residents including an elderly person need to be moved.
                contact_number: '09170000000'
                number_of_people: 3
                status: open
                status_note: null
                handled_by: null
                created_at: '2026-11-03T09:45:00Z'
                updated_at: '2026-11-03T09:47:00Z'
                resolved_at: null
