  /assistance-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Assistance Requests]
      summary: Get an assistance request by id
      description: Commuters can read only their own requests (others return 404). Admins can read all.
      operationId: getAssistanceRequest
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequest'
              example:
                id: 21
                requester_id: 12
                street_id: 7
                coverage_area_id: 1
                report_id: 101
                request_type: evacuation
                description: Elderly resident cannot leave the house, water is entering.
                contact_number: '09170000000'
                number_of_people: 2
                status: acknowledged
                status_note: Rescue team dispatched.
                handled_by: 15
                created_at: '2026-11-03T09:45:00Z'
                updated_at: '2026-11-03T09:50:00Z'
                resolved_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assistance Requests]
      summary: Edit the details of an assistance request
      description: >-
        The owner may edit `request_type`, `description`, `contact_number` and `number_of_people` **only while the
        status is `open`** (otherwise 409). Admins may edit details in any non-terminal status. `status`, `street_id` and
        ownership cannot be changed here; use `PATCH /assistance-requests/{id}/status` for status changes.
      operationId: updateAssistanceRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceRequestUpdate'
            example:
              number_of_people: 3
              description: Three residents including an elderly person need to be moved.
