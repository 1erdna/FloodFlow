          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Assistance Requests]
      summary: Delete an assistance request
      description: >-
        The owner may delete their own request only when its status is `open` or `cancelled` (otherwise 409).
        Admins may delete any request, for example to clean up resolved or cancelled records.
      operationId: deleteAssistanceRequest
      responses:
        '204':
          description: Request deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /assistance-requests/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Assistance Requests]
      summary: Change the status of an assistance request
      description: |
        Allowed transitions: `open` -> `acknowledged` -> `in_progress` -> `resolved`; and `open`, `acknowledged` or
        `in_progress` -> `cancelled`. `resolved` and `cancelled` are final (409 on any further change). Statuses cannot go backward.
        * **Admins** may make any allowed transition. Their id is stored in `handled_by`; `resolved_at` is set on `resolved`.
        * **The owner** may only set `cancelled` (otherwise 403).
      operationId: changeAssistanceRequestStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistanceStatusChange'
            example:
              status: acknowledged
              status_note: Rescue team dispatched.
      responses:
        '200':
          description: Status changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistanceRequest'
