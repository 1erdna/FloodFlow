# Revision Summary
# 1. Each report is now linked to a street through the required street_id in FloodReport and POST /reports.
# 2. Flood severity, observation time and report status are defined in FloodSeverity, FloodReport.observed_at and ReportStatus.
# 3. The street's overall flood status is now computed from reports in Street.flood_status (StreetFloodStatus) instead of being edited directly.
# 4. Owners can edit or delete only their pending reports, admins can edit, delete and verify any report, and reports stop counting 6 hours after observed_at (PATCH and DELETE /reports/{id}, PATCH /reports/{id}/verification).
# 5. The drainage estimate and its related routes were removed on instructor advice, so no drainage routes remain.
# 6. Bypasses are described as suggestions that include last_updated and never claim a street is safe (GET /streets/{id}/bypasses).
# 7. The missing components section was added, containing all schemas, parameters, responses and the bearerAuth security scheme.
# 8. Every operation now has tags, a summary, defined inputs, and 2xx and 4xx responses with schemas.
# 9. The scope was limited to 5 flood-prone areas, with /coverage-areas and /assistance-requests added as core resources.

openapi: 3.0.3
info:
  title: FloodFlow CDO API
  version: 2.0.0
  description: |
    **FloodFlow CDO**, a community flood alert system for Cagayan de Oro.
    Commuters and barangay officials submit flood reports for streets, admins verify them,
    the API derives each street's current flood status from recent reports, suggests bypass streets,
    publishes rain advisories, and lets residents request assistance.

    
    The system only covers flood-prone areas identified for the city. Each coverage area is one barangay and records its `district`. 

    ##### **Note**:
    - We removed drainage observation and drainage estimate due to instructor suggestion.
    - We will only limit 5 flood prone-areas. Not the whole city. Due to instructor suggestion also.

     **Group MojoGojo** (ITCC 14): Mark Dichos (Leader), Andrei Nacaya, Denz Macasero, Dann Roa.
    
  contact:
    name: MojoGojo - ITCC 14
servers:
  - url: http://localhost:3000/api
tags:
  - name: Auth
    description: Registration and login. Owner - Mark Dichos.
  - name: Users
    description: User accounts and role management. Owner - Mark Dichos.
  - name: Coverage Areas
    description: Barangays or districts that group streets, advisories and users. Owner - Dann Roa.
  - name: Streets
    description: Street records, report-based flood status and bypass suggestions. Owner - Andrei Nacaya.
  - name: Reports
    description: Flood reports and their verification (main resource). Owner - Andrei Nacaya.
  - name: Advisories
    description: Admin-posted rain advisories and evacuation warnings. Owner - Denz Macasero.
  - name: Assistance Requests
    description: Requests for rescue, evacuation, medical help or supplies. Owner - Denz Macasero.
security:
  - bearerAuth: []
paths:
  # ---------------------------------------------------------------- AUTH
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new commuter account
      description: >-
        Creates a user with the `commuter` role. Admin accounts are created by promoting an existing
        user through `PUT /users/{id}`.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Mark Dichos
              email: mark@example.com
              password: example-password-123
              coverage_area_id: 1
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: <jwt-token>
                user:
                  id: 12
                  name: Mark Dichos
                  email: mark@example.com
                  role: commuter
                  coverage_area_id: 1
                  created_at: '2026-11-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: mark@example.com
              password: example-password-123
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token: <jwt-token>
                user:
                  id: 12
                  name: Mark Dichos
                  email: mark@example.com
                  role: commuter
                  coverage_area_id: 1
                  created_at: '2026-11-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 401
                error: Unauthorized
                message: Invalid email or password.
  # --------------------------------------------------------------- USERS
  /users:
    get:
      tags: [Users]
      summary: List all users (admin)
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          description: Filter by role.
          schema:
            $ref: '#/components/schemas/Role'
        - name: coverage_area_id
          in: query
          description: Filter by the user's coverage area.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - id: 12
                  name: Mark Dichos
                  email: mark@example.com
                  role: commuter
                  coverage_area_id: 1
                  created_at: '2026-11-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    get:
      tags: [Users]
      summary: Get the logged-in user's profile
      operationId: getMyProfile
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 12
                name: Mark Dichos
                email: mark@example.com
                role: commuter
                coverage_area_id: 1
                created_at: '2026-11-03T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update the logged-in user's profile
      description: Users cannot change their own role. Use `PUT /users/{id}` (admin) for that.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              name: Mark D.
              email: mark@example.com
              coverage_area_id: 2
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 12
                name: Mark D.
                email: mark@example.com
                role: commuter
                coverage_area_id: 2
                created_at: '2026-11-03T09:30:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Users]
      summary: Get a user by id (admin)
      operationId: getUser
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 12
                name: Mark Dichos
                email: mark@example.com
                role: commuter
                coverage_area_id: 1
                created_at: '2026-11-03T09:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update a user, including their role (admin)
      description: An admin cannot remove their own admin role (returns 409) so the system always keeps at least one admin.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminUpdate'
            example:
              name: Maria Loiza
              email: maria@barangay-carmen.example
              role: admin
              coverage_area_id: 1
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 15
                name: Maria Loiza
                email: maria@barangay-carmen.example
                role: admin
                coverage_area_id: 1
                created_at: '2026-11-04T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      summary: Delete a user (admin)
      description: |
        Effect on related records:
        * Their flood reports are **kept** but `reporter_id` becomes `null` so street status stays accurate.
        * Their `open` assistance requests are set to `cancelled`; other requests are kept with `requester_id` set to `null`.
        * Advisories they created are kept (`created_by` becomes `null`).
        An admin cannot delete their own account (409).
      operationId: deleteUser
      responses:
        '204':
          description: User deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ------------------------------------------------------ COVERAGE AREAS
  /coverage-areas:
    get:
      tags: [Coverage Areas]
      summary: List coverage areas
      description: Any logged-in user can read. Inactive areas are hidden unless `include_inactive=true` (admin only).
      operationId: listCoverageAreas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: district
          in: query
          description: Only areas in this district.
          schema:
            $ref: '#/components/schemas/District'
        - name: is_coastal_riverfront
          in: query
          description: Only coastal/riverfront zones when true.
          schema:
            type: boolean
        - name: include_inactive
          in: query
          description: Include inactive areas. Ignored for commuters.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of coverage areas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageArea'
              example:
                - id: 1
                  name: Carmen
                  barangay: Carmen
                  city: Cagayan de Oro
                  district: first_district
                  is_coastal_riverfront: true
                  description: Low-lying area near the Cagayan River.
                  is_active: true
                  created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Coverage Areas]
      summary: Create a coverage area (admin)
      description: >-
        Only flood-prone barangays listed in the API scope (see `info.description`) should be added.
        The same barangay cannot be added twice (409).
      operationId: createCoverageArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageAreaInput'
            example:
              name: Carmen
              barangay: Carmen
              city: Cagayan de Oro
              district: first_district
              is_coastal_riverfront: true
              description: Low-lying area near the Cagayan River.
              is_active: true
      responses:
        '201':
          description: Coverage area created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageArea'
              example:
                id: 1
                name: Carmen
                barangay: Carmen
                city: Cagayan de Oro
                district: first_district
                is_coastal_riverfront: true
                description: Low-lying area near the Cagayan River.
                is_active: true
                created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /coverage-areas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Coverage Areas]
      summary: Get a coverage area by id
      operationId: getCoverageArea
      responses:
        '200':
          description: The coverage area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageArea'
              example:
                id: 1
                name: Carmen
                barangay: Carmen
                city: Cagayan de Oro
                district: first_district
                is_coastal_riverfront: true
                description: Low-lying area near the Cagayan River.
                is_active: true
                created_at: '2026-11-01T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Coverage Areas]
      summary: Replace a coverage area (admin)
      description: >-
        Full update. Setting `is_active` to false hides the area from commuters but keeps its streets,
        reports and advisories.
      operationId: updateCoverageArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageAreaInput'
            example:
              name: Carmen
              barangay: Carmen
              city: Cagayan de Oro
              district: first_district
              is_coastal_riverfront: true
              description: Updated description.
              is_active: true
      responses:
        '200':
          description: Coverage area updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageArea'
              example:
                id: 1
                name: Carmen
                barangay: Carmen
                city: Cagayan de Oro
                district: first_district
                is_coastal_riverfront: true
                description: Updated description.
                is_active: true
                created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Coverage Areas]
      summary: Delete a coverage area (admin)
      description: >-
        Returns 409 if any street still belongs to the area (deactivate it with PUT instead).
        If only users or advisories reference it, their `coverage_area_id` is set to `null`
        (advisories with `null` are city-wide).
      operationId: deleteCoverageArea
      responses:
        '204':
          description: Coverage area deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ------------------------------------------------------------ STREETS
  /streets:
    get:
      tags: [Streets]
      summary: List streets with their current flood status
      description: Each street includes the computed `flood_status`. Inactive streets are hidden from commuters.
      operationId: listStreets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: coverage_area_id
          in: query
          description: Only streets in this coverage area.
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          description: Case-insensitive search on the street name.
          schema:
            type: string
            maxLength: 100
        - name: flood_level
          in: query
          description: Only streets whose current flood status level matches.
          schema:
            $ref: '#/components/schemas/FloodLevel'
      responses:
        '200':
          description: A page of streets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Street'
              example:
                - id: 7
                  name: Villarin Street
                  coverage_area_id: 1
                  latitude: 8.4906
                  longitude: 124.6445
                  connected_street_ids: [8, 9]
                  is_active: true
                  flood_status:
                    level: moderate
                    active_report_count: 3
                    verified_report_count: 1
                    last_updated: '2026-11-03T09:10:00Z'
                    computed_at: '2026-11-03T09:30:00Z'
                    note: Based on 3 reports from the last 6 hours. This is not a safety guarantee.
                  created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Streets]
      summary: Create a street record (admin)
      description: >-
        The street must belong to an active coverage area (404 if it does not exist, 409 if it is inactive).
      operationId: createStreet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreetCreate'
            example:
              name: Villarin Street
              coverage_area_id: 1
              latitude: 8.4906
              longitude: 124.6445
              connected_street_ids: [8, 9]
      responses:
        '201':
          description: Street created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Street'
              example:
                id: 7
                name: Villarin Street
                coverage_area_id: 1
                latitude: 8.4906
                longitude: 124.6445
                connected_street_ids: [8, 9]
                is_active: true
                flood_status:
                  level: no_recent_reports
                  active_report_count: 0
                  verified_report_count: 0
                  last_updated: null
                  computed_at: '2026-11-01T08:00:00Z'
                  note: No reports in the last 6 hours. This does not mean the street is safe.
                created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /streets/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Streets]
      summary: Get a street and its current flood status
      operationId: getStreet
      responses:
        '200':
          description: The street.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Street'
              example:
                id: 7
                name: Villarin Street
                coverage_area_id: 1
                latitude: 8.4906
                longitude: 124.6445
                connected_street_ids: [8, 9]
                is_active: true
                flood_status:
                  level: moderate
                  active_report_count: 3
                  verified_report_count: 1
                  last_updated: '2026-11-03T09:10:00Z'
                  computed_at: '2026-11-03T09:30:00Z'
                  note: Based on 3 reports from the last 6 hours. This is not a safety guarantee.
                created_at: '2026-11-01T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Streets]
      summary: Update a street record (admin)
      description: >-
        Partial update of name, location, connections, area or `is_active`. `flood_status` cannot be set here.
        Moving a street to another coverage area does not change its existing reports.
      operationId: updateStreet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreetUpdate'
            example:
              name: Villarin Street (Carmen)
              is_active: true
      responses:
        '200':
          description: Street updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Street'
              example:
                id: 7
                name: Villarin Street (Carmen)
                coverage_area_id: 1
                latitude: 8.4906
                longitude: 124.6445
                connected_street_ids: [8, 9]
                is_active: true
                flood_status:
                  level: no_recent_reports
                  active_report_count: 0
                  verified_report_count: 0
                  last_updated: null
                  computed_at: '2026-11-03T10:00:00Z'
                  note: No reports in the last 6 hours. This does not mean the street is safe.
                created_at: '2026-11-01T08:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Streets]
      summary: Delete a street (admin)
      description: >-
        Returns 409 if the street has any flood reports or assistance requests (set `is_active` to false with PATCH instead,
        so history is preserved). The street is also removed from other streets' `connected_street_ids`.
      operationId: deleteStreet
      responses:
        '204':
          description: Street deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /streets/{id}/bypasses:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Streets]
      summary: Get suggested bypass streets
      description: |
        Returns **suggestions only**, built from reports currently available. Candidates are active streets listed in the
        street's `connected_street_ids`. Candidates whose level is `high` or `severe` are excluded. The rest are ordered:
        `clear`, then `low`, then `moderate`, then `no_recent_reports`. Each suggestion shows when its information was last
        updated. A street is never described as "safe", and `no_recent_reports` means unknown, not safe.
        Returns an empty list when no suggestion can be made.
      operationId: getStreetBypasses
      responses:
        '200':
          description: Bypass suggestions (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BypassSuggestionList'
              example:
                street_id: 7
                computed_at: '2026-11-03T09:30:00Z'
                disclaimer: Suggestions are based on recent community reports and may be outdated. Check conditions yourself before travelling.
                suggestions:
                  - street_id: 8
                    name: Max Suniel Street
                    level: low
                    active_report_count: 1
                    last_updated: '2026-11-03T09:00:00Z'
                    note: Based on 1 report from the last 6 hours.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  # ------------------------------------------------------------ REPORTS
  /reports:
    get:
      tags: [Reports]
      summary: List flood reports
      description: |
        By default returns **active** reports (not expired, not rejected). Commuters also see their own rejected reports.
        Admins can see everything with `active=false` or by filtering `status`.
      operationId: listReports
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: street_id
          in: query
          description: Only reports for this street.
          schema:
            type: integer
            minimum: 1
        - name: coverage_area_id
          in: query
          description: Only reports for streets in this coverage area.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          description: Filter by report status.
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: severity
          in: query
          description: Filter by severity.
          schema:
            $ref: '#/components/schemas/FloodSeverity'
        - name: active
          in: query
          description: When true (default) only reports that still influence street status; false includes expired ones.
          schema:
            type: boolean
            default: true
        - name: mine
          in: query
          description: Only reports submitted by the logged-in user.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of reports, newest `observed_at` first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FloodReport'
              example:
                - id: 101
                  street_id: 7
                  reporter_id: 12
                  severity: moderate
                  description: Knee-deep near the school gate.
                  observed_at: '2026-11-03T09:10:00Z'
                  expires_at: '2026-11-03T15:10:00Z'
                  is_active: true
                  status: pending
                  verified_by: null
                  verified_at: null
                  verification_reason: null
                  resolved_at: null
                  created_at: '2026-11-03T09:12:00Z'
                  updated_at: '2026-11-03T09:12:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Reports]
      summary: Submit a flood report for a street
      description: >-
        Creates a `pending` report owned by the logged-in user. The street must exist and be active.
        The street's `flood_status` is recalculated immediately.
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FloodReportCreate'
            example:
              street_id: 7
              severity: moderate
              description: Knee-deep near the school gate.
              observed_at: '2026-11-03T09:10:00Z'
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodReport'
              example:
                id: 101
                street_id: 7
                reporter_id: 12
                severity: moderate
                description: Knee-deep near the school gate.
                observed_at: '2026-11-03T09:10:00Z'
                expires_at: '2026-11-03T15:10:00Z'
                is_active: true
                status: pending
                verified_by: null
                verified_at: null
                verification_reason: null
                resolved_at: null
                created_at: '2026-11-03T09:12:00Z'
                updated_at: '2026-11-03T09:12:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Reports]
      summary: Get a flood report by id
      description: Commuters can read any non-rejected report and their own rejected reports. Admins can read all.
      operationId: getReport
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodReport'
              example:
                id: 101
                street_id: 7
                reporter_id: 12
                severity: moderate
                description: Knee-deep near the school gate.
                observed_at: '2026-11-03T09:10:00Z'
                expires_at: '2026-11-03T15:10:00Z'
                is_active: true
                status: verified
                verified_by: 15
                verified_at: '2026-11-03T09:20:00Z'
                verification_reason: Confirmed by barangay tanod.
                resolved_at: null
                created_at: '2026-11-03T09:12:00Z'
                updated_at: '2026-11-03T09:20:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Reports]
      summary: Edit a report or mark it resolved
      description: |
        **Who can edit**
        * The owner may change `severity`, `description` and `observed_at` **only while the report is `pending`** (otherwise 403).
        * The owner may set `status` to `resolved` while the report is `pending` or `verified`.
        * Admins may edit any report in any status.
        * `street_id`, `reporter_id` and the verification fields cannot be changed here. To correct a wrong street, delete the report and create a new one.
        * `status` accepts only `resolved` here. Use `PATCH /reports/{id}/verification` for `verified` and `rejected`.
        * Rejected and already resolved reports cannot be marked resolved (409).

        The street's `flood_status` is recalculated after every change.
      operationId: updateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FloodReportUpdate'
            example:
              severity: high
              description: Water is now waist-deep.
      responses:
        '200':
          description: Report updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodReport'
              example:
                id: 101
                street_id: 7
                reporter_id: 12
                severity: high
                description: Water is now waist-deep.
                observed_at: '2026-11-03T09:10:00Z'
                expires_at: '2026-11-03T15:10:00Z'
                is_active: true
                status: pending
                verified_by: null
                verified_at: null
                verification_reason: null
                resolved_at: null
                created_at: '2026-11-03T09:12:00Z'
                updated_at: '2026-11-03T09:40:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Reports]
      summary: Delete a flood report
      description: >-
        The owner may delete only their own `pending` report (otherwise 403). Admins may delete any report.
        The street's `flood_status` is recalculated after deletion. Assistance requests that referenced the report keep
        existing, with `report_id` set to `null`.
      operationId: deleteReport
      responses:
        '204':
          description: Report deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{id}/verification:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Reports]
      summary: Verify or reject a report (admin)
      description: |
        Admin only. Allowed transitions: `pending` -> `verified` or `rejected`; `verified` -> `rejected` and
        `rejected` -> `verified` (corrections). A `resolved` report cannot be verified or rejected (409).
        `reason` is required when rejecting. A rejected report stops influencing the street's `flood_status`.
        The admin's id and the time are stored in `verified_by` and `verified_at`.
      operationId: verifyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportVerification'
            example:
              decision: rejected
              reason: Photo shows a different street.
      responses:
        '200':
          description: Verification recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloodReport'
              example:
                id: 101
                street_id: 7
                reporter_id: 12
                severity: moderate
                description: Knee-deep near the school gate.
                observed_at: '2026-11-03T09:10:00Z'
                expires_at: '2026-11-03T15:10:00Z'
                is_active: false
                status: rejected
                verified_by: 15
                verified_at: '2026-11-03T09:25:00Z'
                verification_reason: Photo shows a different street.
                resolved_at: null
                created_at: '2026-11-03T09:12:00Z'
                updated_at: '2026-11-03T09:25:00Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
